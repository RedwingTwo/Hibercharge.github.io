<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibercharge</title>
    <style>
        /* Reset margins and set full screen height */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Dark fallback background color */
        }

        /* Hero container with the hibernating bear background */
        .hero-container {
            position: relative;
            height: 100vh;
            width: 100%;
            /* Replace the URL below with your actual image path or URL */
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dark overlay to ensure the white text is easily readable */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55); 
            z-index: 1;
        }

        /* Content wrapper positioned above the overlay */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            max-width: 800px;
            padding: 0 20px;
        }

        /* Main Heading Styling */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #f1f5f9;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        /* Slogan Text Styling */
        p {
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.4;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.7);
        }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- The dark overlay ensures text contrast against the bear image -->
        <div class="overlay"></div>
        
        <div class="content">
            <h1>Hibercharge</h1>
            <p>"Don't die in your sleep" hibercharge will save your life.</p>
        </div>
    </div>

</body>
</html>
