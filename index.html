<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibercharge - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        
        .bear {
            font-size: 120px;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .tagline {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        .under-construction {
            background: #ffc107;
            color: #333;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .message {
            color: #555;
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .coming-soon {
            color: #764ba2;
            font-weight: bold;
            font-size: 1.3em;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bear">🐻</div>
        <h1>Hibercharge</h1>
        <p class="tagline">Battery Maintenance Made Simple</p>
        
        <div class="under-construction">🚧 Under Construction 🚧</div>
        
        <p class="message">
            We're working hard to bring smart battery maintenance to life. 
            Our bear is hibernating while we prepare something amazing for you.
        </p>
        
        <p class="coming-soon">Coming Soon...</p>
    </div>
</body>
</html>
