<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibercharge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            overflow: hidden;
        }

        .hero-container {
            position: relative;
            height: 100vh;
            width: 100%;
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            max-width: 800px;
            padding: 0 20px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
        }

        p {
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 40px;
            text-shadow: 1px 1px 8px rgba(0, 0, 0, 0.8);
        }

        /* Interactive Action Button */
        .charge-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            background-color: #e11d48; /* Crimson alert red */
            border: none;
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .charge-btn:hover {
            background-color: #be123c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.6);
        }

        .charge-btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.3rem; margin-bottom: 30px; }
            .charge-btn { padding: 12px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="overlay"></div>
        
        <div class="content">
            <h1>Hibercharge</h1>
            <p>"Don't die in your sleep" hibercharge will save your life.</p>
            <!-- Link navigating directly to death.html -->
            <a href="death.html" class="charge-btn">Check Battery Status</a>
        </div>
    </div>

</body>
</html>
