<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Dark, minimalist style mimicking a dead or flat battery screen */
        body {
            height: 100vh;
            background-color: #05050a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
        }

        .alert-box {
            text-align: center;
            padding: 20px;
        }

        /* Dead Battery Visual Indicator */
        .battery-icon {
            width: 80px;
            height: 40px;
            border: 3px solid #334155;
            border-radius: 6px;
            position: relative;
            margin: 0 auto 30px auto;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 10px;
            width: 5px;
            height: 14px;
            background-color: #334155;
            border-radius: 0 3px 3px 0;
        }

        /* Red critical line indicator */
        .battery-level {
            height: 100%;
            width: 8%;
            background-color: #ef4444;
            border-radius: 2px 0 0 2px;
            animation: blink 1.5s infinite;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f87171; /* Warning red tint */
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .back-btn {
            font-size: 0.9rem;
            color: #64748b;
            text-decoration: none;
            border: 1px solid #334155;
            padding: 8px 20px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: #ffffff;
            border-color: #64748b;
            background-color: #0f172a;
        }

        /* Simple blinking critical battery animation */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="alert-box">
        <!-- Visual component matching the theme -->
        <div class="battery-icon">
            <div class="battery-level"></div>
        </div>

        <h1>Your device died</h1>
        <p>Hibercharge protection was not active.  The device has died and will not recharge.  Hibercharge will keep the next one you buy alive.</p>

        <!-- Link back to safety -->
        <a href="index.html" class="back-btn">Return to Hibercharge</a>
    </div>

</body>
</html>
